<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: oklch(0.15 0.014 258);
      --surface: oklch(0.205 0.014 258);
      --surface-2: oklch(0.24 0.014 258);
      --border: oklch(0.32 0.014 258);
      --border-strong: oklch(0.40 0.016 258);
      --text: oklch(0.94 0.006 258);
      --muted: oklch(0.66 0.014 258);
      --faint: oklch(0.48 0.014 258);
      --green: #34D399;
      --red: #F87171;
      --amber: #FBBF24;
      --violet: #A78BFA;
      --font-sans: 'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
      --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--accent, #22D3EE); }
    a:hover { color: var(--text); }
    ::selection { background: var(--accent, #22D3EE); color: #0a0f14; }
    .lg-row:hover { background: var(--surface-2); }
  </style>
</helmet>

<div style="width:1440px;height:900px;background:var(--bg);color:var(--text);font-family:var(--font-sans);display:flex;flex-direction:column;padding:44px 60px;gap:24px;position:relative;overflow:hidden;">

  <div style="position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);background-size:64px 64px;opacity:0.06;pointer-events:none;"></div>

  <!-- header -->
  <div style="display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;">
    <div style="display:flex;flex-direction:column;gap:4px;">
      <div style="display:flex;align-items:baseline;gap:10px;">
        <span style="font-family:var(--font-mono);font-weight:600;font-size:22px;letter-spacing:2px;">FFDO</span>
        <span style="font-family:var(--font-mono);font-size:12px;color:{{accent}};letter-spacing:1px;">/ SETUP</span>
      </div>
      <span style="font-size:13px;color:var(--muted);">Track every league you're in &mdash; draft day through week 17.</span>
    </div>
  </div>

  <!-- step rail -->
  <div style="display:flex;align-items:center;gap:14px;position:relative;z-index:1;font-family:var(--font-mono);font-size:12px;">
    <span style="display:flex;align-items:center;gap:8px;color:var(--green);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Connect a provider</span>
    <span style="width:34px;height:1px;background:var(--border-strong);"></span>
    <span style="display:flex;align-items:center;gap:8px;color:{{accent}};"><span style="width:20px;height:20px;border-radius:50%;border:1px solid {{accent}};display:flex;align-items:center;justify-content:center;font-size:11px;">2</span>Pick leagues to track</span>
    <span style="width:34px;height:1px;background:var(--border-strong);"></span>
    <span style="display:flex;align-items:center;gap:8px;color:var(--faint);"><span style="width:20px;height:20px;border-radius:50%;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:11px;">3</span>Open a league</span>
  </div>

  <!-- discovery card -->
  <div style="flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:26px 30px 0;display:flex;flex-direction:column;position:relative;z-index:1;min-height:0;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--faint);font-weight:600;">Leagues found</span>
        <span style="font-family:var(--font-mono);font-size:12px;color:var(--muted);">Sleeper &middot; noahdschroeder &middot; 2026</span>
      </div>
      <span style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>
        Re-scan
      </span>
    </div>

    <!-- column header -->
    <div style="display:grid;grid-template-columns:34px 1fr 130px 128px;gap:16px;padding:0 8px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);border-bottom:1px solid var(--border);">
      <span></span><span>League</span><span>Format</span><span>Draft</span>
    </div>

    <!-- rows -->
    <div style="display:flex;flex-direction:column;overflow:hidden;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div class="lg-row" style="display:grid;grid-template-columns:34px 1fr 130px 128px;gap:16px;align-items:center;padding:15px 8px;border-bottom:1px solid var(--border);cursor:pointer;" onClick="{{r.toggle}}">
          <span style="{{r.boxStyle}}">
            <sc-if value="{{r.checked}}" hint-placeholder-val="{{true}}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0a0f14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </sc-if>
          </span>
          <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
            <span style="font-size:14px;font-weight:600;">{{r.name}}</span>
            <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--faint);">{{r.meta}}</span>
          </div>
          <span style="{{r.formatStyle}}">{{r.format}}</span>
          <span style="{{r.draftStyle}}">{{r.draft}}</span>
        </div>
      </sc-for>
    </div>

    <!-- footer bar -->
    <div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:18px 2px;border-top:1px solid var(--border);">
      <span style="font-size:12.5px;color:var(--muted);"><b style="color:var(--text);font-family:var(--font-mono);">{{selectedCount}}</b> selected &nbsp;&middot;&nbsp; <a href="#" style="color:{{accent}};">add by league ID</a></span>
      <button style="display:flex;align-items:center;gap:9px;font-family:var(--font-sans);font-size:14px;font-weight:600;padding:11px 20px;border-radius:8px;border:none;cursor:pointer;color:#0a0f14;background:{{accent}};">
        Track selected leagues
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#22D3EE","options":["#22D3EE","#818CF8","#34D399","#FBBF24"]}}'>
const LEAGUES = [
  { id: 'a', name: 'P-Vegas Ballers',      meta: '12-team · auction · 49 scoring keys',  format: 'KEEPER',  draft: 'PRE_DRAFT', def: true },
  { id: 'b', name: 'Dynasty Warehouse',    meta: '12-team · superflex · TE premium',     format: 'DYNASTY', draft: 'COMPLETE',  def: true },
  { id: 'c', name: 'Sunday Scaries',       meta: '10-team · half-PPR · FAAB $100',       format: 'REDRAFT', draft: 'COMPLETE',  def: true },
  { id: 'd', name: 'The Money League',     meta: '14-team · PPR · reverse-standings',    format: 'REDRAFT', draft: 'DRAFTING',  def: false },
  { id: 'e', name: 'College Buddies 2016', meta: '8-team · standard · last active 2023', format: 'REDRAFT', draft: 'COMPLETE',  def: false },
  { id: 'f', name: 'Work Bestball',        meta: '12-team · bestball · no waivers',      format: 'REDRAFT', draft: 'COMPLETE',  def: false },
];
const DEFAULT_PICKED = Object.fromEntries(LEAGUES.map((d) => [d.id, d.def]));

class Component extends DCLogic {
  toggle(id) {
    const cur = this.state.picked || DEFAULT_PICKED;
    this.setState({ picked: { ...cur, [id]: !cur[id] } });
  }

  renderVals() {
    const accent = this.props.accent || '#22D3EE';

    const badge = 'font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.8px;padding:5px 9px;border-radius:5px;white-space:nowrap;width:fit-content;';
    const fmt = {
      REDRAFT: badge + 'color:var(--muted);background:var(--surface-2);border:1px solid var(--border-strong);',
      KEEPER: badge + 'color:var(--amber);background:color-mix(in oklch, var(--amber) 12%, transparent);border:1px solid color-mix(in oklch, var(--amber) 38%, transparent);',
      DYNASTY: badge + 'color:var(--violet);background:color-mix(in oklch, var(--violet) 14%, transparent);border:1px solid color-mix(in oklch, var(--violet) 40%, transparent);',
    };
    const draft = {
      PRE_DRAFT: badge + 'color:var(--amber);background:color-mix(in oklch, var(--amber) 12%, transparent);border:1px solid color-mix(in oklch, var(--amber) 38%, transparent);',
      DRAFTING: badge + 'color:var(--green);background:color-mix(in oklch, var(--green) 14%, transparent);border:1px solid color-mix(in oklch, var(--green) 40%, transparent);',
      COMPLETE: badge + 'color:var(--faint);background:transparent;border:1px solid var(--border);',
    };

    const picked = this.state.picked || DEFAULT_PICKED;
    const rows = LEAGUES.map((d) => {
      const checked = !!picked[d.id];
      return {
        ...d,
        checked,
        toggle: () => this.toggle(d.id),
        boxStyle: 'width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;' +
          (checked ? `background:${accent};border:1px solid ${accent};` : 'background:var(--bg);border:1px solid var(--border-strong);'),
        formatStyle: fmt[d.format],
        draftStyle: draft[d.draft],
      };
    });
    const selectedCount = rows.filter((r) => r.checked).length;

    return { accent, rows, selectedCount };
  }
}
</script>
</body>
</html>
