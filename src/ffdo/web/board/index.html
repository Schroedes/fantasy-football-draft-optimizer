<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>
<div id="board-root"></div>
<script type="module">
import { mount } from "./board.js";
const key = new URLSearchParams(location.search).get("league");
if (!key) { document.getElementById("board-root").textContent = "No league specified — open this board from the app."; }
else {
  const res = await fetch(`/api/leagues/${encodeURIComponent(key)}`);
  if (!res.ok) { document.getElementById("board-root").textContent = "League not found."; }
  else {
    const meta = await res.json();
    mount(document.getElementById("board-root"), key, meta);
  }
}
</script>
</body>
</html>
