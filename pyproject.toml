[project]
name = "ffdo"
version = "0.1.0"
description = "Fantasy football draft optimizer"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ffdo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
